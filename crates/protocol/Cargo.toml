[lib]
crate-type = ["cdylib", "rlib"]

[package]
description = "Shared o-sfu bundle and signaling protocol types"
name = "o-sfu-protocol"

authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.93"
version.workspace = true

[features]
ts-bindings = [
    "dep:ts-rs",
    "o-sfu-model/ts-bindings",
    "o-sfu-rfc/ts-bindings",
]
verification-models = []

[[bin]]
name = "o-sfu-protocol-ts"
path = "src/bin/o_sfu_protocol_ts.rs"
required-features = ["ts-bindings"]

[dependencies]
o-sfu-model.workspace = true
o-sfu-rfc.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
ts-rs = { workspace = true, optional = true }
wasm-bindgen = "0.2"

[lints]
workspace = true
