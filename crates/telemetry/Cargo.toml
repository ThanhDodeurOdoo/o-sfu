[package]
name = "o-sfu-telemetry"
description = "Operator-facing telemetry schemas, metrics, diagnostics, and formatting for o-sfu"

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["macros"]
macros = ["dep:o-sfu-telemetry-macros"]
test-support = []
otel-tracing = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

[dependencies]
anyhow.workspace = true
o-sfu-model.workspace = true
o-sfu-telemetry-macros = { path = "macros", optional = true }
opentelemetry = { version = "0.31", features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"], optional = true }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"], optional = true }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tracing.workspace = true
tracing-opentelemetry = { version = "0.32", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[lints]
workspace = true
