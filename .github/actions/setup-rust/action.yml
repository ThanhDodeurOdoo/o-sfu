# Shared setup for jobs that use the compiler selected by rust-toolchain.toml.
# Cargo CI defaults apply only when callers have not selected their own values.

name: Set up repository Rust toolchain
description: Install the repository toolchain, optional components and report versions

inputs:
  components:
    description: Space-separated Rustup components to install
    required: false
    default: ""

outputs:
  rustc-version:
    description: Version reported by rustc
    value: ${{ steps.versions.outputs.rustc-version }}

runs:
  using: composite
  steps:
    - name: Configure Cargo environment
      shell: bash
      run: |
        if [[ -z "${CARGO_INCREMENTAL+x}" ]]; then
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        fi
        if [[ -z "${CARGO_TERM_COLOR+x}" ]]; then
          echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
        fi

    - name: Install repository Rust toolchain
      shell: bash
      run: rustup toolchain install --profile minimal --no-self-update

    - name: Install optional Rust components
      if: inputs.components != ''
      shell: bash
      env:
        O_SFU_RUST_COMPONENTS: ${{ inputs.components }}
      run: |
        set -euo pipefail
        read -r -a components <<< "$O_SFU_RUST_COMPONENTS"
        # No-argument toolchain installs ignore component flags for the active toolchain.
        rustup component add "${components[@]}"

    - name: Report Rust versions
      id: versions
      shell: bash
      run: |
        set -euo pipefail
        rustc_version="$(rustc --version)"
        echo "rustc-version=${rustc_version}" >> "$GITHUB_OUTPUT"
        rustup show active-toolchain
        rustc --version --verbose
        cargo --version --verbose
        rustup --version
