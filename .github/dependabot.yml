# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "cargo"
      - "AI"
      - "lang-rust"

  - package-ecosystem: "cargo"
    directory: "/crates/router"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "cargo"
      - "AI"
      - "lang-rust"

  - package-ecosystem: "cargo"
    directory: "/crates/core"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "cargo"
      - "AI"
      - "lang-rust"

  - package-ecosystem: "cargo"
    directory: "/crates/telemetry"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "cargo"
      - "AI"
      - "lang-rust"

  - package-ecosystem: "cargo"
    directory: "/crates/protocol"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "cargo"
      - "AI"
      - "lang-rust"

  - package-ecosystem: "cargo"
    directory: "/tests"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "cargo"
      - "AI"
      - "lang-rust"

  - package-ecosystem: "npm"
    directory: "/crates/client"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "npm"
      - "AI"
      - "lang-js"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
      - "AI"
      - "ci"
