fail-on-severity: moderate
fail-on-scopes:
  - development
  - runtime
  - unknown
allow-licenses:
  - Apache-2.0
  - Apache-2.0 WITH LLVM-exception
  - BSD-2-Clause
  - BSD-3-Clause
  - BSL-1.0
  - CC0-1.0
  - ISC
  - MIT
  - MIT-0
  - NCSA
  - Unicode-3.0
  - Unlicense
allow-dependencies-licenses:
  - pkg:cargo/o-sfu
  - pkg:cargo/o-sfu-cluster
  - pkg:cargo/o-sfu-core
  - pkg:cargo/o-sfu-model
  - pkg:cargo/o-sfu-proofs
  - pkg:cargo/o-sfu-protocol
  - pkg:cargo/o-sfu-rfc
  - pkg:cargo/o-sfu-router
  - pkg:cargo/o-sfu-telemetry
  - pkg:cargo/o-sfu-telemetry-macros
  - pkg:cargo/o-sfu-tests
