name: Container Image

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # required to publish non-PR images to GitHub Container Registry
      packages: write

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v3
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Prepare image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        # docker/login-action v3
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        # docker/metadata-action v5
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch }}

      - name: Build and publish image
        # docker/build-push-action v6
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          # keep the default image CPU-portable. if a benchmark proves that
          # a production host needs CPU-specific codegen, add a separate image
          # tag and pass an explicit CPU through the Dockerfile instead of
          # using target-cpu=native on the GitHub runner
          platforms: linux/amd64
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ github.event_name == 'pull_request' && 'false' || 'mode=max' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select smoke-test image
        id: smoke-image
        if: github.event_name == 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image_tag="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          if [[ -z "$image_tag" ]]; then
            echo "No image tag was produced for the smoke test" >&2
            exit 1
          fi
          echo "tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Smoke test image
        if: github.event_name == 'pull_request'
        env:
          IMAGE_TAG: ${{ steps.smoke-image.outputs.tag }}
        run: |
          set -euo pipefail
          container_id="$(docker run --detach \
            --env AUTH_KEY=u6bsUQEWrHdKIuYplirRnbBmLbrKV5PxKG7DtA71mng= \
            --env BIND_ADDRESS=0.0.0.0:8070 \
            --env PUBLIC_IP=127.0.0.1 \
            --publish 127.0.0.1:18070:8070 \
            "$IMAGE_TAG")"
          healthy=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18070/v1/noop >/dev/null; then
              healthy=1
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != "true" ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$healthy" == "1" ]]; then
            docker rm --force "$container_id" >/dev/null
            exit 0
          fi
          docker logs "$container_id" || true
          docker rm --force "$container_id" >/dev/null 2>&1 || true
          exit 1
