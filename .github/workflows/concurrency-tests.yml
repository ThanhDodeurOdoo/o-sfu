name: Concurrency Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loom:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Loom transport coordination model
        run: cargo test -p o-sfu-tests --test loom_source_policy_coordination --features loom-tests
