name: Performance

on:
  # keep this expensive Callgrind job scoped to packet routing hot paths and benchmark ownership files
  push:
    branches: [main, master]
    paths:
      - .github/workflows/performance.yml
      - Cargo.lock
      - crates/core/Cargo.toml
      - crates/core/src/engine/media_transport/**
      - crates/core/src/engine/packet_sink_registry.rs
      - crates/core/src/engine/recording/**
      - crates/core/src/engine/rtc/**
      - tests/Cargo.toml
      - tests/benchmarks/**
  pull_request:
    branches: [main, master]
    paths:
      - .github/workflows/performance.yml
      - Cargo.lock
      - crates/core/Cargo.toml
      - crates/core/src/engine/media_transport/**
      - crates/core/src/engine/packet_sink_registry.rs
      - crates/core/src/engine/recording/**
      - crates/core/src/engine/rtc/**
      - tests/Cargo.toml
      - tests/benchmarks/**
  workflow_dispatch:
    # these knobs are for manual diagnosis only
    # pull requests keep using the deterministic slice summary path below
    inputs:
      base_ref:
        description: Base ref for manual Callgrind comparison
        required: false
        type: string
      worker_investigation:
        description: Run the manual current-thread worker benchmark on the head ref
        required: false
        default: false
        type: boolean
      cache_simulation:
        description: Enable Callgrind cache simulation for manual runs
        required: false
        default: false
        type: boolean
      branch_simulation:
        description: Enable Callgrind branch simulation for manual runs
        required: false
        default: false
        type: boolean
      flamegraphs:
        description: Generate flamegraph artifacts for the manual worker benchmark
        required: false
        default: false
        type: boolean
      dhat:
        description: Add DHAT allocation artifacts for manual runs
        required: false
        default: false
        type: boolean

# every job in this workflow is read-only because the benchmark job runs pull request code
# .github/workflows/performance-comment.yml owns PR comments from uploaded artifacts
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packet-loop-callgrind:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # this job checks out and benchmarks pull request code, so it must not receive a write token
    permissions:
      contents: read

    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      INPUT_BASE_REF: ${{ github.event.inputs.base_ref }}
      INPUT_BRANCH_SIMULATION: ${{ github.event.inputs.branch_simulation }}
      INPUT_CACHE_SIMULATION: ${{ github.event.inputs.cache_simulation }}
      INPUT_DHAT: ${{ github.event.inputs.dhat }}
      INPUT_FLAMEGRAPHS: ${{ github.event.inputs.flamegraphs }}
      INPUT_WORKER_INVESTIGATION: ${{ github.event.inputs.worker_investigation }}
      PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      PUSH_BEFORE_SHA: ${{ github.event.before }}

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Callgrind dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq valgrind

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain master
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: rust-1.95-gungraun

      - name: Install Gungraun runner
        run: cargo install gungraun-runner --version 0.19.0 --locked

      - name: Configure manual investigation options
        id: investigation
        run: |
          set -euo pipefail

          # manual inputs are empty for push and pull_request events
          # every benchmark step still consumes the same outputs below
          callgrind_args=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_CACHE_SIMULATION" == "true" ]]; then
            callgrind_args="--cache-sim=yes"
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_BRANCH_SIMULATION" == "true" ]]; then
            callgrind_args="${callgrind_args:+${callgrind_args} }--branch-sim=yes"
          fi

          tools=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_DHAT" == "true" ]]; then
            tools="dhat"
          fi

          flamegraphs=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_FLAMEGRAPHS" == "true" ]]; then
            flamegraphs="1"
          fi

          # later steps export only non-empty outputs
          # this keeps push and pull_request runs on the default deterministic profile
          {
            echo "callgrind-args=${callgrind_args}"
            echo "flamegraphs=${flamegraphs}"
            echo "tools=${tools}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve comparison refs
        id: refs
        run: |
          set -euo pipefail

          git fetch --no-tags origin +refs/heads/*:refs/remotes/origin/*

          # pull requests compare the target branch commit against GitHub's synthetic merge commit
          # this catches the performance impact of the code exactly as it would enter the base branch
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="$PULL_REQUEST_BASE_SHA"
            head_ref="refs/remotes/origin/pr-${PULL_REQUEST_NUMBER}-merge"
            git fetch --no-tags origin "pull/${PULL_REQUEST_NUMBER}/merge:${head_ref}"
          # pushes compare the previous branch tip against the commit that triggered the workflow
          elif [[ "$GITHUB_EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_ref="$PUSH_BEFORE_SHA"
            head_ref="$GITHUB_SHA"
          # manual runs use the requested base ref or the default branch when no input was provided
          else
            base_ref="${INPUT_BASE_REF:-origin/${DEFAULT_BRANCH}}"
            head_ref="$GITHUB_SHA"
          fi

          # fail before running Valgrind when a ref cannot be resolved to a commit
          git cat-file -e "${base_ref}^{commit}"
          git cat-file -e "${head_ref}^{commit}"

          echo "base-ref=${base_ref}" >> "$GITHUB_OUTPUT"
          echo "head-ref=${head_ref}" >> "$GITHUB_OUTPUT"

      - name: Save base Callgrind baseline
        run: |
          callgrind_args='${{ steps.investigation.outputs.callgrind-args }}'
          tools='${{ steps.investigation.outputs.tools }}'
          if [[ -n "$callgrind_args" ]]; then
            export GUNGRAUN_CALLGRIND_ARGS="$callgrind_args"
          fi
          if [[ -n "$tools" ]]; then
            export GUNGRAUN_TOOLS="$tools"
          fi

          # Gungraun stores the named baseline under target/gungraun for the next step in this same job
          git checkout --force "${{ steps.refs.outputs.base-ref }}"
          cargo bench --locked -p o-sfu-tests --bench packet_loop_callgrind -- --save-baseline=base --save-summary=json

      - name: Compare head Callgrind baseline
        run: |
          callgrind_args='${{ steps.investigation.outputs.callgrind-args }}'
          tools='${{ steps.investigation.outputs.tools }}'
          if [[ -n "$callgrind_args" ]]; then
            export GUNGRAUN_CALLGRIND_ARGS="$callgrind_args"
          fi
          if [[ -n "$tools" ]]; then
            export GUNGRAUN_TOOLS="$tools"
          fi

          # the head run loads the saved base baseline and emits JSON summaries with base-versus-head deltas
          git checkout --force "${{ steps.refs.outputs.head-ref }}"
          cargo bench --locked -p o-sfu-tests --bench packet_loop_callgrind -- --baseline=base --save-summary=json

      - name: Run manual worker Callgrind investigation
        if: github.event_name == 'workflow_dispatch' && inputs.worker_investigation
        run: |
          # worker investigation measures the whole command path on the head ref only
          # it is not a base-versus-head gate and it never feeds PR comments
          callgrind_args='${{ steps.investigation.outputs.callgrind-args }}'
          flamegraphs='${{ steps.investigation.outputs.flamegraphs }}'
          tools='${{ steps.investigation.outputs.tools }}'
          if [[ -n "$callgrind_args" ]]; then
            export GUNGRAUN_CALLGRIND_ARGS="$callgrind_args"
          fi
          if [[ -n "$flamegraphs" ]]; then
            export O_SFU_CALLGRIND_FLAMEGRAPHS="$flamegraphs"
          fi
          if [[ -n "$tools" ]]; then
            export GUNGRAUN_TOOLS="$tools"
          fi

          # this target is diagnostic only
          # normal pull_request runs never execute it
          # manual PR comments may show its top-level summary when this run maps to one open PR
          git checkout --force "${{ steps.refs.outputs.head-ref }}"
          cargo bench --locked -p o-sfu-tests --features worker-benchmarks --bench packet_loop_worker_callgrind -- --save-summary=json

      - name: Collect Callgrind summaries
        if: always()
        run: |
          # collect summaries even after failures so the PR comment and artifact show what happened
          mkdir -p performance-artifacts
          mapfile -t summary_files < <(find target/gungraun -type f -name '*.json' | sort)
          if ((${#summary_files[@]})); then
            jq -s '.' "${summary_files[@]}" > performance-artifacts/callgrind-summary.json
          else
            printf '[]\n' > performance-artifacts/callgrind-summary.json
          fi
          {
            printf 'base_ref=%s\n' '${{ steps.refs.outputs.base-ref }}'
            printf 'head_ref=%s\n' '${{ steps.refs.outputs.head-ref }}'
            printf 'pull_request_number=%s\n' "$PULL_REQUEST_NUMBER"
            printf 'workflow_event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'worker_investigation=%s\n' "${INPUT_WORKER_INVESTIGATION:-false}"
            printf 'cache_simulation=%s\n' "${INPUT_CACHE_SIMULATION:-false}"
            printf 'branch_simulation=%s\n' "${INPUT_BRANCH_SIMULATION:-false}"
            printf 'flamegraphs=%s\n' "${INPUT_FLAMEGRAPHS:-false}"
            printf 'dhat=%s\n' "${INPUT_DHAT:-false}"
            printf 'callgrind_args=%s\n' '${{ steps.investigation.outputs.callgrind-args }}'
            printf 'tools=%s\n' '${{ steps.investigation.outputs.tools }}'
          } > performance-artifacts/callgrind-refs.env

      - name: Upload Callgrind artifacts
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          # keep the raw Gungraun output available for local inspection when the summary is not enough
          name: packet-loop-callgrind-${{ github.run_id }}
          path: |
            target/gungraun/**
            performance-artifacts/callgrind-summary.json
            performance-artifacts/callgrind-refs.env
          if-no-files-found: warn
          retention-days: 14
