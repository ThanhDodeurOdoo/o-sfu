name: Performance

on:
  # keep this expensive Callgrind job scoped to packet routing hot paths and benchmark ownership files
  push:
    branches: [main, master]
    paths:
      - .github/workflows/performance.yml
      - Cargo.lock
      - crates/core/Cargo.toml
      - crates/core/src/runtime/media_transport/**
      - crates/core/src/runtime/packet_sink_registry.rs
      - crates/core/src/runtime/recording/**
      - crates/core/src/runtime/rtc_engine/**
      - tests/Cargo.toml
      - tests/benchmarks/**
  pull_request:
    branches: [main, master]
    paths:
      - .github/workflows/performance.yml
      - Cargo.lock
      - crates/core/Cargo.toml
      - crates/core/src/runtime/media_transport/**
      - crates/core/src/runtime/packet_sink_registry.rs
      - crates/core/src/runtime/recording/**
      - crates/core/src/runtime/rtc_engine/**
      - tests/Cargo.toml
      - tests/benchmarks/**
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref for manual Callgrind comparison
        required: false
        type: string

# default every job to read-only repository access
# the comment job opts into issue writes later but never runs pull request code
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packet-loop-callgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # this job checks out and benchmarks pull request code, so it must not receive a write token
    permissions:
      contents: read

    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      INPUT_BASE_REF: ${{ github.event.inputs.base_ref }}
      PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      PUSH_BEFORE_SHA: ${{ github.event.before }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Callgrind dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq valgrind

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-1.95-callgrind

      - name: Install iai-callgrind runner
        run: cargo install iai-callgrind-runner --version 0.16.1 --locked

      - name: Resolve comparison refs
        id: refs
        run: |
          set -euo pipefail

          git fetch --no-tags origin +refs/heads/*:refs/remotes/origin/*

          # pull requests compare the target branch commit against GitHub's synthetic merge commit
          # this catches the performance impact of the code exactly as it would enter the base branch
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="$PULL_REQUEST_BASE_SHA"
            head_ref="refs/remotes/origin/pr-${PULL_REQUEST_NUMBER}-merge"
            git fetch --no-tags origin "pull/${PULL_REQUEST_NUMBER}/merge:${head_ref}"
          # pushes compare the previous branch tip against the commit that triggered the workflow
          elif [[ "$GITHUB_EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_ref="$PUSH_BEFORE_SHA"
            head_ref="$GITHUB_SHA"
          # manual runs use the requested base ref or the default branch when no input was provided
          else
            base_ref="${INPUT_BASE_REF:-origin/${DEFAULT_BRANCH}}"
            head_ref="$GITHUB_SHA"
          fi

          # fail before running Valgrind when a ref cannot be resolved to a commit
          git cat-file -e "${base_ref}^{commit}"
          git cat-file -e "${head_ref}^{commit}"

          echo "base-ref=${base_ref}" >> "$GITHUB_OUTPUT"
          echo "head-ref=${head_ref}" >> "$GITHUB_OUTPUT"

      - name: Save base Callgrind baseline
        run: |
          # iai-callgrind stores the named baseline under target/iai for the next step in this same job
          git checkout --force "${{ steps.refs.outputs.base-ref }}"
          cargo bench -p o-sfu-tests --bench packet_loop_callgrind -- --save-baseline=base --save-summary=json

      - name: Compare head Callgrind baseline
        run: |
          # the head run loads the saved base baseline and emits JSON summaries with base-versus-head deltas
          git checkout --force "${{ steps.refs.outputs.head-ref }}"
          cargo bench -p o-sfu-tests --bench packet_loop_callgrind -- --baseline=base --save-summary=json

      - name: Collect Callgrind summaries
        if: always()
        run: |
          # collect summaries even after failures so the PR comment and artifact show what happened
          mkdir -p performance-artifacts
          mapfile -t summary_files < <(find target/iai -type f -name '*.json' | sort)
          if ((${#summary_files[@]})); then
            jq -s '.' "${summary_files[@]}" > performance-artifacts/callgrind-summary.json
          else
            printf '[]\n' > performance-artifacts/callgrind-summary.json
          fi
          {
            printf 'base_ref=%s\n' '${{ steps.refs.outputs.base-ref }}'
            printf 'head_ref=%s\n' '${{ steps.refs.outputs.head-ref }}'
          } > performance-artifacts/callgrind-refs.env

      - name: Upload Callgrind artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # keep the raw iai-callgrind output available for local inspection when the summary is not enough
          name: packet-loop-callgrind-${{ github.run_id }}
          path: |
            target/iai/**
            performance-artifacts/callgrind-summary.json
            performance-artifacts/callgrind-refs.env
          if-no-files-found: warn
          retention-days: 14

  comment:
    if: always() && github.event_name == 'pull_request'
    needs: packet-loop-callgrind
    runs-on: ubuntu-latest
    # this job only consumes uploaded artifacts and the GitHub API
    # it is separated from the benchmark job so pull request code never runs with issue write access
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read

    env:
      ARTIFACT_NAME: packet-loop-callgrind-${{ github.run_id }}
      BENCHMARK_RESULT: ${{ needs.packet-loop-callgrind.result }}

    steps:
      - name: Download Callgrind artifacts
        uses: actions/download-artifact@v4
        # forks may not have enough token permissions to comment
        # comments are useful but should never decide whether the benchmark itself passed
        continue-on-error: true
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: performance-comment

      - name: Update PR Callgrind summary comment
        uses: actions/github-script@v8
        continue-on-error: true
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            // keep one bot-owned summary per pull request instead of creating a new comment on each run
            const marker = "<!-- o-sfu-callgrind-summary -->";
            const artifactName = process.env.ARTIFACT_NAME;
            const benchmarkResult = process.env.BENCHMARK_RESULT;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const summaryPath = path.join(
              "performance-comment",
              "performance-artifacts",
              "callgrind-summary.json",
            );
            const refsPath = path.join(
              "performance-comment",
              "performance-artifacts",
              "callgrind-refs.env",
            );

            function readJsonArray(filePath) {
              if (!fs.existsSync(filePath)) {
                return [];
              }
              const value = JSON.parse(fs.readFileSync(filePath, "utf8"));
              return Array.isArray(value) ? value : [value];
            }

            function readRefs(filePath) {
              if (!fs.existsSync(filePath)) {
                return {};
              }
              return Object.fromEntries(
                fs.readFileSync(filePath, "utf8")
                  .split(/\r?\n/)
                  .filter(Boolean)
                  .map((line) => {
                    const separator = line.indexOf("=");
                    if (separator === -1) {
                      return [line, ""];
                    }
                    return [line.slice(0, separator), line.slice(separator + 1)];
                  }),
              );
            }

            function metricValue(metric) {
              if (metric == null) {
                return null;
              }
              if (typeof metric === "number") {
                return metric;
              }
              if (typeof metric === "string") {
                const parsed = Number(metric);
                return Number.isFinite(parsed) ? parsed : null;
              }
              if (Object.prototype.hasOwnProperty.call(metric, "Int")) {
                return Number(metric.Int);
              }
              if (Object.prototype.hasOwnProperty.call(metric, "Float")) {
                return Number(metric.Float);
              }
              return null;
            }

            function formatInteger(value) {
              return value == null || !Number.isFinite(value)
                ? "n/a"
                : Math.round(value).toLocaleString("en-US");
            }

            function formatDelta(value) {
              const parsed = Number(value);
              return Number.isFinite(parsed) ? `${parsed.toFixed(3)}%` : "n/a";
            }

            function escapeCell(value) {
              return String(value ?? "n/a").replaceAll("|", "\\|").replaceAll("\n", " ");
            }

            function benchmarkName(summary) {
              return summary.id
                ? `${summary.function_name}/${summary.id}`
                : summary.function_name || summary.module_path || "unknown";
            }

            function callgrindProfile(summary) {
              return (summary.profiles || []).find((profile) => profile.tool === "Callgrind");
            }

            function callgrindMetric(summary, metricName) {
              const profile = callgrindProfile(summary);
              return profile?.summaries?.total?.summary?.Callgrind?.[metricName] ?? null;
            }

            function regressions(summary) {
              const profile = callgrindProfile(summary);
              return profile?.summaries?.total?.regressions || [];
            }

            function hasIrRegression(summary) {
              return regressions(summary).some((regression) => {
                const payload = regression.Soft || regression.Hard || {};
                return payload.metric?.Callgrind === "Ir";
              });
            }

            function rowFromSummary(summary) {
              const ir = callgrindMetric(summary, "Ir");
              const metrics = ir?.metrics;
              const both = metrics?.Both;
              if (!Array.isArray(both) || both.length !== 2) {
                return null;
              }
              // iai-callgrind reports comparison metrics as [head, base] for the Both variant
              const head = metricValue(both[0]);
              const base = metricValue(both[1]);
              return {
                name: benchmarkName(summary),
                base,
                head,
                delta: ir?.diffs?.diff_pct,
                result: hasIrRegression(summary) ? "regression" : "ok",
              };
            }

            const rows = readJsonArray(summaryPath)
              .map(rowFromSummary)
              .filter(Boolean)
              .sort((left, right) => left.name.localeCompare(right.name));
            const refs = readRefs(refsPath);
            const regressionCount = rows.filter((row) => row.result === "regression").length;
            const status = benchmarkResult === "success" && regressionCount === 0
              ? "ok"
              : "needs review";
            const tableRows = rows.slice(0, 25).map((row) => [
              escapeCell(row.name),
              formatInteger(row.base),
              formatInteger(row.head),
              formatDelta(row.delta),
              row.result,
            ].join(" | "));
            const table = rows.length
              ? [
                "| benchmark | base Ir | head Ir | delta | result |",
                "| --- | ---: | ---: | ---: | --- |",
                ...tableRows.map((row) => `| ${row} |`),
              ].join("\n")
              : "no comparable Callgrind summary rows were produced";
            const omitted = rows.length > 25
              ? `\n\n${rows.length - 25} additional benchmark rows are in the artifact`
              : "";
            const body = [
              marker,
              "## packet-loop Callgrind",
              "",
              `status: ${status}`,
              `benchmark job: ${benchmarkResult}`,
              `base ref: ${refs.base_ref || "n/a"}`,
              `head ref: ${refs.head_ref || "n/a"}`,
              "",
              table,
              omitted,
              "",
              `artifact: \`${artifactName}\``,
              `[workflow run](${runUrl})`,
            ].filter(Boolean).join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user.type === "Bot" && comment.body.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
