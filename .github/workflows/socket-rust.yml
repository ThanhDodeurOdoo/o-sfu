name: Socket Rust

on:
  push:
    branches: [main, master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - .github/workflows/socket-rust.yml
  pull_request:
    branches: [main, master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - .github/workflows/socket-rust.yml
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  socket-rust:
    name: Socket Rust SBOM
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain master
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0

      - name: Setup Node.js
        # actions/setup-node v5
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Check Cargo metadata
        run: cargo metadata --locked --format-version 1 >/dev/null

      - name: Install Socket CLI
        run: npm install --global socket@1.1.112

      - name: Generate Rust CycloneDX SBOM
        run: socket cdxgen -t cargo -o socket-rust.cdx.json --no-install-deps --fail-on-error .

      - name: Run Socket Rust scan
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          SOCKET_SECURITY_ORG: ${{ vars.SOCKET_SECURITY_ORG }}
        run: |
          set -euo pipefail
          if [[ -z "$SOCKET_SECURITY_API_KEY" ]]; then
            echo "SOCKET_SECURITY_API_KEY is required" >&2
            exit 1
          fi
          if [[ -z "$SOCKET_SECURITY_ORG" ]]; then
            echo "SOCKET_SECURITY_ORG repository variable is required" >&2
            exit 1
          fi

          repo_name="${GITHUB_REPOSITORY//\//_}"

          scan_args=(
            scan create
            --report
            --org="$SOCKET_SECURITY_ORG"
            --repo="$repo_name"
            --branch="$BRANCH_NAME"
            --commit-hash="$GITHUB_SHA"
            --no-interactive
          )

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            scan_args+=(--pull-request="$PR_NUMBER" --tmp)
          fi

          if [[ "$BRANCH_NAME" == "$DEFAULT_BRANCH" ]]; then
            scan_args+=(--default-branch="$DEFAULT_BRANCH")
          fi

          scan_args+=(socket-rust.cdx.json)
          socket "${scan_args[@]}"
