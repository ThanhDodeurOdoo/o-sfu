name: UB Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  miri_host:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: miri_host
            runner: ubuntu-latest
            host_suite: true
          - name: miri_aarch64
            runner: ubuntu-24.04-arm
            host_suite: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install Rust nightly with Miri
        # dtolnay/rust-toolchain master
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-04-01
          components: miri

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: nightly-miri-${{ matrix.name }}

      - name: Bootstrap Miri
        run: cargo +nightly-2026-04-01 miri setup

      - name: Run SIMD fingerprint UB test
        run: cargo +nightly-2026-04-01 miri test --locked -p o-sfu-core --lib packet_fingerprint_matches_scalar_reference

      - name: Run host-target UB-oriented tests
        if: matrix.host_suite
        run: |
          MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly-2026-04-01 miri test -p o-sfu-tests --test miri_auth_codec
          cargo +nightly-2026-04-01 miri test -p o-sfu-tests --test miri_protocol_core
          cargo +nightly-2026-04-01 miri test -p o-sfu-tests --test miri_rtp_negotiation

  # Keep the cross-target big-endian replay off pull requests because it needs
  # extra toolchain setup
  miri_big_endian:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install Rust nightly with Miri
        # dtolnay/rust-toolchain master
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-04-01
          components: miri

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: nightly-miri

      - name: Bootstrap Miri
        run: cargo +nightly-2026-04-01 miri setup

      - name: Install big-endian Miri target
        run: rustup target add --toolchain nightly-2026-04-01 s390x-unknown-linux-gnu

      - name: Install s390x cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-s390x-linux-gnu

      - name: Run focused big-endian UB-oriented tests
        run: |
          MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly-2026-04-01 miri test \
            -p o-sfu-tests \
            --target s390x-unknown-linux-gnu \
            --test miri_auth_codec
          cargo +nightly-2026-04-01 miri test \
            -p o-sfu-tests \
            --target s390x-unknown-linux-gnu \
            --test miri_rtp_negotiation
