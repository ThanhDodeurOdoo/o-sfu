name: Formal Verification

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  KANI_VERSION: 0.67.0

jobs:
  kani:
    name: Kani (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: rfc-h264
            command: >-
              cargo kani -p o-sfu-proofs
              --harness h264_profile_level_id_parse_matches_rfc_patterns
          - shard: router-rtp
            command: >-
              cargo kani -p o-sfu-proofs
              --harness derive_consumable_rtp_parameters_keeps_only_valid_primary_links
              --harness negotiate_consumer_rtp_parameters_keeps_only_surviving_consumer_links
          - shard: router-teardown
            command: >-
              cargo kani -p o-sfu-proofs
              --harness session_teardown_clears_reverse_indices_and_dependents
              --harness removing_a_producer_clears_dependents_but_keeps_live_transports
              --harness removing_a_consumer_preserves_other_routes_and_indices
          - shard: router-pause
            command: >-
              cargo kani -p o-sfu-proofs
              --harness new_consumers_inherit_their_producer_pause_shadow
              --harness pausing_a_producer_updates_all_dependent_consumers
              --harness resuming_a_producer_clears_dependent_consumer_pause_shadows
              --harness consumer_local_pause_stays_independent_from_producer_shadow_updates
          - shard: protocol-recovery-close
            command: >-
              cargo kani -p o-sfu-proofs
              --harness protocol_core_terminal_close_codes_never_schedule_recovery
              --harness protocol_core_non_terminal_close_with_context_recovers_once
              --harness protocol_core_recovery_timer_reconnects_only_from_recovering
          - shard: protocol-recovery-reset
            command: >-
              cargo kani -p o-sfu-proofs
              --harness protocol_core_welcome_resets_recovery_backoff
              --harness protocol_core_disconnect_suppresses_recovery_and_allows_fresh_connect

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache Kani installation
        uses: actions/cache@v4
        with:
          path: ~/.kani
          key: ${{ runner.os }}-${{ runner.arch }}-kani-${{ env.KANI_VERSION }}

      - name: Install Kani CLI
        run: cargo install --locked --version "$KANI_VERSION" kani-verifier

      - name: Bootstrap Kani release bundle
        shell: bash
        run: |
          set -euo pipefail

          kani_dir="$HOME/.kani/kani-${KANI_VERSION}"
          if [[ -f "$kani_dir/rust-toolchain-version" ]]; then
            exit 0
          fi

          case "$(uname -m)" in
            x86_64)
              target="x86_64-unknown-linux-gnu"
              ;;
            aarch64 | arm64)
              target="aarch64-unknown-linux-gnu"
              ;;
            *)
              echo "Unsupported runner architecture for Kani: $(uname -m)" >&2
              exit 1
              ;;
          esac

          bundle="kani-${KANI_VERSION}-${target}.tar.gz"
          url="https://github.com/model-checking/kani/releases/download/kani-${KANI_VERSION}/${bundle}"

          rm -rf "$kani_dir"
          curl --retry 5 --retry-delay 5 --retry-all-errors -sSLf \
            -o "$RUNNER_TEMP/$bundle" \
            "$url"
          cargo-kani setup --use-local-bundle "$RUNNER_TEMP/$bundle"

      - name: Run Kani proofs
        run: ${{ matrix.command }}
