name: Formal Verification

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KANI_VERSION: 0.67.0

jobs:
  kani:
    name: Kani (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: rfc-h264
            command: >-
              cargo kani -p o-sfu-proofs
              --harness h264_profile_level_id_parse_matches_rfc_patterns
          - shard: router-symbolic-adds
            command: >-
              cargo kani -p o-sfu-proofs
              -Z unstable-options
              --harness bounded_symbolic_router_adds_preserve_invariants
              --harness concrete_router_adds_write_reverse_index_memberships
          - shard: router-symbolic-routing
            command: >-
              cargo kani -p o-sfu-proofs
              -Z unstable-options
              --output-format terse
              --harness router::proofs::route_trace
          - shard: router-symbolic-cleanup
            command: >-
              cargo kani -p o-sfu-proofs
              -Z unstable-options
              --harness bounded_symbolic_router_cleanup_trace_preserves_invariants
          - shard: router-session-teardown
            command: >-
              cargo kani -p o-sfu-proofs
              -Z unstable-options
              --harness session_teardown_clears_reverse_indices_and_dependents
          - shard: router-topology
            command: >-
              cargo kani -p o-sfu-proofs
              --harness routing_shadow_refcounts_prune_after_last_consumer
              --harness routing_placement_replacement_retires_stale_connection
          - shard: router-producer-removal
            command: >-
              cargo kani -p o-sfu-proofs
              -Z unstable-options
              --harness removing_a_producer_clears_dependents_but_keeps_live_transports
          - shard: router-consumer-removal
            command: >-
              cargo kani -p o-sfu-proofs
              -Z unstable-options
              --harness removing_a_consumer_preserves_other_routes_and_indices
          - shard: router-consumer-inherit-pause
            command: >-
              cargo kani -p o-sfu-proofs
              -Z unstable-options
              --harness new_consumers_inherit_their_producer_pause_shadow
          - shard: router-producer-pause
            command: >-
              cargo kani -p o-sfu-proofs
              -Z unstable-options
              --harness pausing_a_producer_updates_all_dependent_consumers
          - shard: router-producer-resume
            command: >-
              cargo kani -p o-sfu-proofs
              -Z unstable-options
              --harness resuming_a_producer_clears_dependent_consumer_pause_shadows
          - shard: router-consumer-local-pause
            command: >-
              cargo kani -p o-sfu-proofs
              -Z unstable-options
              --harness consumer_local_pause_stays_independent_from_producer_shadow_updates
          - shard: protocol-recovery-close
            command: >-
              cargo kani -p o-sfu-proofs
              --harness protocol_core_terminal_close_codes_never_schedule_recovery
              --harness protocol_core_non_terminal_close_with_context_recovers_once
              --harness protocol_core_recovery_timer_reconnects_only_from_recovering
          - shard: protocol-recovery-reset
            command: >-
              cargo kani -p o-sfu-proofs
              --harness protocol_core_welcome_resets_recovery_backoff
              --harness protocol_core_disconnect_suppresses_recovery_and_allows_fresh_connect

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain master
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Cache Kani installation
        # actions/cache v5
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.kani
          key: ${{ runner.os }}-${{ runner.arch }}-kani-${{ env.KANI_VERSION }}

      - name: Install Kani CLI
        run: cargo install --locked --version "$KANI_VERSION" kani-verifier

      - name: Bootstrap Kani release bundle
        shell: bash
        run: |
          set -euo pipefail

          kani_dir="$HOME/.kani/kani-${KANI_VERSION}"
          if [[ -f "$kani_dir/rust-toolchain-version" ]]; then
            exit 0
          fi

          case "$(uname -m)" in
            x86_64)
              target="x86_64-unknown-linux-gnu"
              ;;
            aarch64 | arm64)
              target="aarch64-unknown-linux-gnu"
              ;;
            *)
              echo "Unsupported runner architecture for Kani: $(uname -m)" >&2
              exit 1
              ;;
          esac

          bundle="kani-${KANI_VERSION}-${target}.tar.gz"
          url="https://github.com/model-checking/kani/releases/download/kani-${KANI_VERSION}/${bundle}"

          rm -rf "$kani_dir"
          curl --retry 5 --retry-delay 5 --retry-all-errors -sSLf \
            -o "$RUNNER_TEMP/$bundle" \
            "$url"
          cargo-kani setup --use-local-bundle "$RUNNER_TEMP/$bundle"

      - name: Run Kani proofs
        run: ${{ matrix.command }}
