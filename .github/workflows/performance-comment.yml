name: Performance Comment

on: # zizmor: ignore[dangerous-triggers] this workflow only parses benchmark artifacts from the read-only Performance workflow
  workflow_run:
    workflows: [Performance]
    types: [completed]

# this workflow receives the write token, so it must only consume benchmark artifacts as data
# the untrusted pull request code runs in .github/workflows/performance.yml with read-only access
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  packet-loop-callgrind-comment:
    if: github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest

    env:
      ARTIFACT_NAME: packet-loop-callgrind-${{ github.event.workflow_run.id }}
      BENCHMARK_RESULT: ${{ github.event.workflow_run.conclusion }}
      BENCHMARK_RUN_URL: ${{ github.event.workflow_run.html_url }}

    steps:
      - name: Download Callgrind artifacts
        # actions/download-artifact v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: performance-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Update PR Callgrind summary comment
        # actions/github-script v8
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            // keep one bot-owned summary per pull request instead of creating a new comment on each run
            const marker = "<!-- o-sfu-callgrind-summary -->";
            const artifactName = process.env.ARTIFACT_NAME;
            const benchmarkResult = process.env.BENCHMARK_RESULT;
            const runUrl = process.env.BENCHMARK_RUN_URL;
            const comparisonRowLimit = 25;
            const summaryPath = path.join(
              "performance-comment",
              "performance-artifacts",
              "callgrind-summary.json",
            );
            const refsPath = path.join(
              "performance-comment",
              "performance-artifacts",
              "callgrind-refs.env",
            );

            function readJsonArray(filePath) {
              if (!fs.existsSync(filePath)) {
                return [];
              }
              const value = JSON.parse(fs.readFileSync(filePath, "utf8"));
              return Array.isArray(value) ? value : [value];
            }

            function readRefs(filePath) {
              if (!fs.existsSync(filePath)) {
                return {};
              }
              return Object.fromEntries(
                fs.readFileSync(filePath, "utf8")
                  .split(/\r?\n/)
                  .filter(Boolean)
                  .map((line) => {
                    const separator = line.indexOf("=");
                    if (separator === -1) {
                      return [line, ""];
                    }
                    return [line.slice(0, separator), line.slice(separator + 1)];
                  }),
              );
            }

            function metricValue(metric) {
              if (metric == null) {
                return null;
              }
              if (typeof metric === "number") {
                return metric;
              }
              if (typeof metric === "string") {
                const parsed = Number(metric);
                return Number.isFinite(parsed) ? parsed : null;
              }
              if (Object.prototype.hasOwnProperty.call(metric, "Int")) {
                return Number(metric.Int);
              }
              if (Object.prototype.hasOwnProperty.call(metric, "Float")) {
                return Number(metric.Float);
              }
              return null;
            }

            function formatInteger(value) {
              return value == null || !Number.isFinite(value)
                ? "n/a"
                : Math.round(value).toLocaleString("en-US");
            }

            function formatDelta(value) {
              const parsed = Number(value);
              return Number.isFinite(parsed) ? `${parsed.toFixed(3)}%` : "n/a";
            }

            function escapeCell(value) {
              return String(value ?? "n/a")
                .replaceAll("|", "\\|")
                .replaceAll("@", "@\u200b")
                .replaceAll("\n", " ");
            }

            function benchmarkLabels(summary) {
              return {
                scope: summary.function_name || summary.module_path || "unknown",
                caseName: summary.id || "default",
              };
            }

            function isWorkerSummary(summary) {
              return path.basename(String(summary.benchmark_file || "")) === "packet_loop_worker_callgrind.rs";
            }

            function callgrindProfile(summary) {
              return (summary.profiles || []).find((profile) => profile.tool === "Callgrind");
            }

            function callgrindMetric(summary, metricName) {
              const profile = callgrindProfile(summary);
              return profile?.summaries?.total?.summary?.Callgrind?.[metricName] ?? null;
            }

            function regressions(summary) {
              const profile = callgrindProfile(summary);
              return profile?.summaries?.total?.regressions || [];
            }

            function hasMetricRegression(summary, metricName) {
              return regressions(summary).some((regression) => {
                const payload = regression.Soft || regression.Hard || {};
                return payload.metric?.Callgrind === metricName;
              });
            }

            function rowFromSummary(summary, metricName) {
              if (isWorkerSummary(summary)) {
                return null;
              }
              const metric = callgrindMetric(summary, metricName);
              const metrics = metric?.metrics;
              const both = metrics?.Both;
              if (!Array.isArray(both) || both.length !== 2) {
                return null;
              }
              // Gungraun reports comparison metrics as [head, base] for the Both variant
              const head = metricValue(both[0]);
              const base = metricValue(both[1]);
              const labels = benchmarkLabels(summary);
              return {
                ...labels,
                sortKey: `${labels.scope}/${labels.caseName}`,
                base,
                head,
                delta: metric?.diffs?.diff_pct,
                result: hasMetricRegression(summary, metricName) ? "regression" : "ok",
              };
            }

            function rowsForMetric(summaries, metricName) {
              return summaries
                .map((summary) => rowFromSummary(summary, metricName))
                .filter(Boolean)
                .sort((left, right) => left.sortKey.localeCompare(right.sortKey));
            }

            function metricTable(rows, metricName, label, baseColumn, headColumn, emptyMessage) {
              if (rows.length === 0) {
                return emptyMessage;
              }
              const tableRows = rows.slice(0, comparisonRowLimit).map((row) => [
                escapeCell(row.scope),
                escapeCell(row.caseName),
                formatInteger(row.base),
                formatInteger(row.head),
                formatDelta(row.delta),
                row.result,
              ].join(" | "));
              const omitted = rows.length > comparisonRowLimit
                ? `\n\n${rows.length - comparisonRowLimit} additional ${label} benchmark rows are in the artifact`
                : "";
              return [
                `**${label}:** ${metricDescription(metricName)}`,
                "",
                `| scope | case | ${baseColumn} | ${headColumn} | delta | result |`,
                "| --- | --- | ---: | ---: | ---: | --- |",
                ...tableRows.map((row) => `| ${row} |`),
                omitted,
              ].filter(Boolean).join("\n");
            }

            function metricDescription(metricName) {
              if (metricName === "Ir") {
                return "instruction reads, the most stable signal for code-shape changes such as added branches, calls or lookups";
              }
              return "Callgrind's estimated cycle cost from simulated memory access, useful for spotting cache and RAM traffic changes";
            }

            function leftMetricValue(metric) {
              if (metric == null || typeof metric !== "object") {
                return metricValue(metric);
              }
              if (Object.prototype.hasOwnProperty.call(metric, "Left")) {
                return metricValue(metric.Left);
              }
              return null;
            }

            function manualWorkerRow(summary) {
              if (!isWorkerSummary(summary)) {
                return null;
              }
              const ir = callgrindMetric(summary, "Ir");
              const value = leftMetricValue(ir?.metrics);
              if (value == null) {
                return null;
              }
              const labels = benchmarkLabels(summary);
              return {
                ...labels,
                sortKey: `${labels.scope}/${labels.caseName}`,
                ir: value,
              };
            }

            function enabledLabel(value) {
              return value === "true" ? "enabled" : "disabled";
            }

            function manualInvestigationSection(summaries, refs) {
              const isManualRun =
                refs.workflow_event === "workflow_dispatch"
                || context.payload.workflow_run.event === "workflow_dispatch";
              if (!isManualRun) {
                return "";
              }

              const workerRequested = refs.worker_investigation === "true";
              const manualOptions = [
                refs.cache_simulation,
                refs.branch_simulation,
                refs.flamegraphs,
                refs.dhat,
              ].some((value) => value === "true");
              const workerRows = summaries
                .map(manualWorkerRow)
                .filter(Boolean)
                .sort((left, right) => left.sortKey.localeCompare(right.sortKey));

              if (!workerRequested && !manualOptions && workerRows.length === 0) {
                return "";
              }

              const optionsTable = [
                "| option | value |",
                "| --- | --- |",
                `| worker investigation | ${workerRequested ? "run" : "skipped"} |`,
                `| cache simulation | ${enabledLabel(refs.cache_simulation)} |`,
                `| branch simulation | ${enabledLabel(refs.branch_simulation)} |`,
                `| flamegraphs | ${enabledLabel(refs.flamegraphs)} |`,
                `| DHAT | ${enabledLabel(refs.dhat)} |`,
              ].join("\n");
              const workerTable = workerRows.length
                ? [
                  "| scope | case | IR |",
                  "| --- | --- | ---: |",
                  ...workerRows.map((row) => [
                    escapeCell(row.scope),
                    escapeCell(row.caseName),
                    formatInteger(row.ir),
                  ].join(" | ")).map((row) => `| ${row} |`),
                ].join("\n")
                : workerRequested
                  ? "worker investigation was requested but no worker Callgrind row was produced"
                  : "";

              return [
                "## manual investigation",
                "",
                optionsTable,
                workerTable ? "" : null,
                workerTable,
                "",
                "manual worker outputs stay diagnostic and are not part of the PR regression table",
              ].filter(Boolean).join("\n");
            }

            async function issueNumberForWorkflowRun(owner, repo) {
              const run = context.payload.workflow_run;
              const attachedIssue = (run.pull_requests || [])
                .map((pullRequest) => Number(pullRequest.number))
                .find((value) => Number.isSafeInteger(value) && value > 0);
              if (attachedIssue) {
                return attachedIssue;
              }

              if (run.event !== "workflow_dispatch") {
                return null;
              }

              const headBranch = run.head_branch;
              const headOwner = run.head_repository?.owner?.login;
              if (!headBranch || !headOwner) {
                return null;
              }

              // manual runs are not pull_request events, so find the open PR by trusted run metadata
              const pulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "open",
                head: `${headOwner}:${headBranch}`,
                per_page: 100,
              });
              const exactHead = pulls.find((pullRequest) => pullRequest.head?.sha === run.head_sha);
              if (exactHead) {
                return exactHead.number;
              }
              return pulls.length === 1 ? pulls[0].number : null;
            }

            const refs = readRefs(refsPath);
            const summaries = readJsonArray(summaryPath);
            const irRows = rowsForMetric(summaries, "Ir");
            const cycleRows = rowsForMetric(summaries, "EstimatedCycles");
            const regressionCount = [...irRows, ...cycleRows]
              .filter((row) => row.result === "regression")
              .length;
            const status = benchmarkResult === "success" && regressionCount === 0
              ? "ok"
              : "needs review";
            const irTable = metricTable(
              irRows,
              "Ir",
              "IR",
              "base IR",
              "head IR",
              "no comparable Callgrind IR summary rows were produced",
            );
            const cycleTable = metricTable(
              cycleRows,
              "EstimatedCycles",
              "Estimated cycles",
              "base cycles",
              "head cycles",
              "no comparable Callgrind estimated-cycle summary rows were produced",
            );
            const comparisonTables = `\n${[irTable, cycleTable].join("\n\n")}`;
            const manualSection = manualInvestigationSection(summaries, refs);
            const body = [
              marker,
              "## Performance benchmark summary",
              "[what is Valgrind/callgrind?](https://valgrind.org/docs/manual/cl-manual.html)",
              "",
              `status: ${status}`,
              `benchmark job: ${benchmarkResult}`,
              `base ref: ${refs.base_ref || "n/a"}`,
              `head ref: ${refs.head_ref || "n/a"}`,
              `artifact: \`${artifactName}\``,
              `[workflow run](${runUrl})`,
              "",
              comparisonTables,
              manualSection ? "" : null,
              manualSection,
              "",
            ].filter(Boolean).join("\n");

            async function writeSummaryFallback(error) {
              if (
                error.status !== 403
                || !String(error.message).includes("Resource not accessible by integration")
              ) {
                throw error;
              }
              core.warning(
                "GITHUB_TOKEN cannot write a PR comment for this run, writing the Callgrind report to the workflow summary instead",
              );
              await core.summary.addRaw(body).write();
            }

            const { owner, repo } = context.repo;
            const issueNumber = await issueNumberForWorkflowRun(owner, repo);
            if (!issueNumber) {
              core.info("performance run is not attached to a single open pull request");
              await core.summary.addRaw(body).write();
              return;
            }

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              const previous = comments.find((comment) =>
                comment.user.type === "Bot" && comment.body.includes(marker)
              );

              if (previous) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: previous.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body,
                });
              }
            } catch (error) {
              await writeSummaryFallback(error);
            }
