name: Fuzzing

on:
  pull_request:
    branches: [main, master]
    paths:
      - .github/workflows/fuzzing.yml
      - Cargo.lock
      - Cargo.toml
      - crates/core/src/runtime/rtc_engine/**
      - crates/protocol/**
      - crates/rfc/**
      - src/application/user_session/**
      - src/config/**
      - src/runtime/auth.rs
      - src/runtime/http_server/**
      - src/runtime/websocket_server/**
      - tests/fuzz/**
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain master
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: nightly-2026-04-01

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: nightly-fuzz

      - name: Check fuzz lockfile
        run: cargo +nightly-2026-04-01 check --manifest-path tests/fuzz/Cargo.toml --locked

  fuzz-targets:
    name: fuzz ${{ matrix.target }}
    needs: fuzz-lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - protocol_decode
          - protocol_sequence
          - http_disconnect_auth
          - sdp_answer
          - packet_loop_ingress_demux

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain master
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: nightly-2026-04-01

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: nightly-fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1 --locked

      - name: Run fuzz target
        working-directory: tests/fuzz
        shell: bash
        run: |
          set -euo pipefail
          max_total_time=300
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            max_total_time=60
          fi
          cargo +nightly-2026-04-01 fuzz run "${{ matrix.target }}" -- -max_total_time="$max_total_time"

      - name: Upload fuzz artifacts
        if: failure()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: |
            tests/fuzz/artifacts
            tests/fuzz/corpus
          retention-days: 7
