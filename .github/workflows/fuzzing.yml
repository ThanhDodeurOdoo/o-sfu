name: Fuzzing

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-decode-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run protocol decode fuzz target
        run: cargo +nightly fuzz run protocol_decode -- -max_total_time=300

      - name: Run protocol sequence fuzz target
        run: cargo +nightly fuzz run protocol_sequence -- -max_total_time=300
