name: Fuzzing

on:
  pull_request:
    branches: [main, master]
    paths:
      - .github/workflows/fuzzing.yml
      - Cargo.lock
      - Cargo.toml
      - crates/core/**
      - crates/model/**
      - crates/protocol/**
      - crates/rfc/**
      - src/**
      - tests/fuzz/**
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain master
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-04-01

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: nightly-fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1 --locked

      - name: Check workspace lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check fuzz targets
        working-directory: tests/fuzz
        run: cargo +nightly-2026-04-01 fuzz check --features fuzz-targets

  fuzz-targets:
    name: fuzz ${{ matrix.target }}
    needs: fuzz-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - protocol_decode
          - protocol_sequence
          - http_disconnect_auth
          - sdp_answer
          - packet_loop_ingress_demux

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain master
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2026-04-01

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: nightly-fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1 --locked

      - name: Run fuzz target
        working-directory: tests/fuzz
        shell: bash
        run: |
          set -euo pipefail
          max_total_time=300
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            max_total_time=60
          fi
          cargo +nightly-2026-04-01 fuzz run --features fuzz-targets "${{ matrix.target }}" -- -max_total_time="$max_total_time"

      - name: Upload fuzz artifacts
        if: failure()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: |
            tests/fuzz/artifacts
            tests/fuzz/corpus
          retention-days: 7
