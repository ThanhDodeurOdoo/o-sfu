name: Fuzzing

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain master
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: nightly-2026-04-01

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: nightly-fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1 --locked

      - name: Check fuzz lockfile
        run: cargo +nightly-2026-04-01 check --manifest-path tests/fuzz/Cargo.toml --locked

      - name: Run fuzz targets
        working-directory: tests/fuzz
        shell: bash
        run: |
          set -euo pipefail
          for target in protocol_decode protocol_sequence http_disconnect_auth sdp_answer; do
            cargo +nightly-2026-04-01 fuzz run "$target" -- -max_total_time=300
          done

      - name: Upload fuzz artifacts
        if: failure()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-artifacts
          path: |
            tests/fuzz/artifacts
            tests/fuzz/corpus
          retention-days: 7
