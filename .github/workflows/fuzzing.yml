name: Fuzzing

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-01

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Check fuzz lockfile
        run: cargo +nightly-2026-04-01 check --manifest-path tests/fuzz/Cargo.toml --locked

      - name: Run fuzz targets
        working-directory: tests/fuzz
        shell: bash
        run: |
          set -euo pipefail
          for target in protocol_decode protocol_sequence http_disconnect_auth sdp_answer packet_loop_demux packet_loop_turn_trace; do
            cargo +nightly-2026-04-01 fuzz run "$target" -- -max_total_time=300
          done

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: |
            tests/fuzz/artifacts
            tests/fuzz/corpus
          retention-days: 7
