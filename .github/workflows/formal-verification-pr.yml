name: PR Formal Verification

on:
  pull_request:
    branches: [main, master]
    paths:
      - .github/workflows/formal-verification-pr.yml
      - Cargo.lock
      - Cargo.toml
      - crates/model/**
      - crates/protocol/**
      - crates/rfc/**
      - crates/router/**
      - tests/proofs/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KANI_VERSION: 0.67.0

jobs:
  kani-pr:
    name: PR Kani (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: router-flow
            covers: 2
            command: >-
              cargo kani -p o-sfu-router
              --no-assertion-reach-checks
              --harness proofs::flow::cross_router_consumer_forms_valid_graph
          - shard: router-replacement
            covers: 1
            command: >-
              cargo kani -p o-sfu-router
              --no-assertion-reach-checks
              --harness proofs::replacement::replacement_rehomes_and_retires_graph
          - shard: router-consumer-removal
            covers: 2
            command: >-
              cargo kani -p o-sfu-router
              --no-assertion-reach-checks
              --harness proofs::teardown::removing_consumer_preserves_sibling_and_shadow
          - shard: router-producer-teardown
            covers: 2
            command: >-
              cargo kani -p o-sfu-router
              --no-assertion-reach-checks
              --harness proofs::teardown::removing_producer_cascades_only_its_dependents
          - shard: router-session-teardown
            covers: 1
            command: >-
              cargo kani -p o-sfu-router
              --no-assertion-reach-checks
              --harness proofs::teardown::receiver_teardown_clears_shadow
          - shard: protocol-recovery-backoff-reset
            command: >-
              cargo kani -p o-sfu-proofs
              --harness protocol_core_welcome_resets_recovery_backoff
          - shard: protocol-disconnect-connecting
            command: >-
              cargo kani -p o-sfu-proofs
              --harness protocol_core_connecting_disconnect_suppresses_recovery
          - shard: protocol-disconnect-authenticated
            command: >-
              cargo kani -p o-sfu-proofs
              --harness protocol_core_authenticated_disconnect_suppresses_recovery
          - shard: protocol-disconnect-connected
            command: >-
              cargo kani -p o-sfu-proofs
              --harness protocol_core_connected_disconnect_suppresses_recovery

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain master
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.95.0

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Cache Kani installation
        # actions/cache v5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.kani
          key: ${{ runner.os }}-${{ runner.arch }}-kani-${{ env.KANI_VERSION }}

      - name: Install Kani CLI
        run: cargo install --locked --version "$KANI_VERSION" kani-verifier

      - name: Bootstrap Kani release bundle
        shell: bash
        run: |
          set -euo pipefail

          kani_dir="$HOME/.kani/kani-${KANI_VERSION}"
          if [[ -f "$kani_dir/rust-toolchain-version" ]]; then
            exit 0
          fi

          case "$(uname -m)" in
            x86_64)
              target="x86_64-unknown-linux-gnu"
              ;;
            aarch64 | arm64)
              target="aarch64-unknown-linux-gnu"
              ;;
            *)
              echo "Unsupported runner architecture for Kani: $(uname -m)" >&2
              exit 1
              ;;
          esac

          bundle="kani-${KANI_VERSION}-${target}.tar.gz"
          url="https://github.com/model-checking/kani/releases/download/kani-${KANI_VERSION}/${bundle}"

          rm -rf "$kani_dir"
          curl --retry 5 --retry-delay 5 --retry-all-errors -sSLf \
            -o "$RUNNER_TEMP/$bundle" \
            "$url"
          cargo-kani setup --use-local-bundle "$RUNNER_TEMP/$bundle"

      - name: Run PR Kani proof shard
        env:
          EXPECTED_COVERS: ${{ matrix.covers || 0 }}
        run: |
          set -o pipefail
          output="$(mktemp)"
          ${{ matrix.command }} 2>&1 | tee "$output"
          if (( EXPECTED_COVERS > 0 )) && \
            ! grep -Fq "** $EXPECTED_COVERS of $EXPECTED_COVERS cover properties satisfied" "$output"
          then
            echo "Expected $EXPECTED_COVERS satisfied cover properties" >&2
            exit 1
          fi
