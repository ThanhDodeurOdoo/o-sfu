name: No OTel Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  no-otel-default-members:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: mainline

      - name: Check default members without OpenTelemetry feature
        run: cargo check --locked --no-default-features

      - name: Run default-member tests without OpenTelemetry feature
        run: cargo test --locked --release --no-default-features

      - name: Run clippy without OpenTelemetry feature
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
