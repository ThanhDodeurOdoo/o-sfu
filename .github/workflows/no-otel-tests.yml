name: No OTel Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  no-otel-workspace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain master
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: clippy

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: rust-1.95-mainline

      - name: Check workspace without OpenTelemetry feature
        run: cargo check --locked --workspace --no-default-features

      - name: Run workspace tests without OpenTelemetry feature
        run: cargo test --locked --workspace --release --no-default-features

      - name: Run clippy without OpenTelemetry feature
        run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings

      - name: Prepare trybuild cache cleanup
        if: always()
        run: mkdir -p target/tests/target
