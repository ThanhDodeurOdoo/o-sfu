name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain master
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --version 0.9.136 --locked

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: rust-1.95-mainline

      - name: Check formatting
        run: cargo fmt --check

      - name: Run library crates with nextest
        run: cargo nextest run -p o-sfu-cluster -p o-sfu-core -p o-sfu-protocol -p o-sfu-rfc -p o-sfu-router

      - name: Run root crate tests
        run: cargo test -p o-sfu

      - name: Run integration and verification crate tests
        run: cargo test -p o-sfu-tests -p o-sfu-proofs

      - name: Run workspace doctests
        run: cargo test --workspace --doc

      - name: Check fuzz targets build
        run: cargo check --manifest-path tests/fuzz/Cargo.toml --locked

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Prepare trybuild cache cleanup
        if: always()
        run: mkdir -p target/tests/target

  coverage-report:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain master
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: rust-1.95-mainline

      - name: Generate workspace coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Export coverage summary
        run: cargo llvm-cov report --json --summary-only --output-path coverage-summary.json

      - name: Prepare trybuild cache cleanup
        if: always()
        run: mkdir -p target/tests/target

      - name: Upload coverage artifacts
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-workspace-coverage
          path: |
            lcov.info
            coverage-summary.json
          retention-days: 7

  container-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Build server container image
        run: docker build --file Dockerfile --tag o-sfu:test .
