name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: fmt
            name: fmt
            nextest: false
            command: cargo fmt --check
          - id: library-nextest
            name: library nextest
            nextest: true
            command: >-
              cargo nextest run --locked --profile ci
              -p o-sfu-cluster
              -p o-sfu-core
              -p o-sfu-model
              -p o-sfu-protocol
              -p o-sfu-rfc
              -p o-sfu-router
              -p o-sfu-telemetry
              -p o-sfu-telemetry-macros
          - id: root-tests
            name: root tests
            nextest: false
            command: cargo test --locked -p o-sfu
          - id: integration-proofs
            name: integration and proof tests
            nextest: false
            command: cargo test --locked -p o-sfu-tests -p o-sfu-proofs
          - id: doctests
            name: doctests
            nextest: false
            command: cargo test --locked --workspace --doc
          - id: fuzz-build
            name: fuzz build
            nextest: false
            command: cargo check --manifest-path tests/fuzz/Cargo.toml --locked
          - id: clippy
            name: clippy
            nextest: false
            command: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain master
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install cargo-nextest
        if: matrix.nextest
        run: cargo install cargo-nextest --version 0.9.136 --locked

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: rust-1.95-${{ matrix.id }}

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Upload nextest JUnit report
        if: always() && matrix.id == 'library-nextest'
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-library-nextest-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 7

      - name: Prepare trybuild cache cleanup
        if: always()
        run: mkdir -p target/tests/target

  release-workspace-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain master
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: rust-1.95-mainline

      - name: Run release workspace tests
        run: cargo test --locked --workspace --release

      - name: Prepare trybuild cache cleanup
        if: always()
        run: mkdir -p target/tests/target

  coverage-report:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain master
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: rust-1.95-mainline

      - name: Generate workspace coverage report
        run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info

      - name: Export coverage summary
        run: cargo llvm-cov report --json --summary-only --output-path coverage-summary.json

      - name: Prepare trybuild cache cleanup
        if: always()
        run: mkdir -p target/tests/target

      - name: Upload coverage artifacts
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-workspace-coverage
          path: |
            lcov.info
            coverage-summary.json
          retention-days: 7

  container-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Build server container image
        run: docker build --file Dockerfile --tag o-sfu:test .
