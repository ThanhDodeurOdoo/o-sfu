name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-1.95-mainline

      - name: Check formatting
        run: cargo fmt --check

      - name: Run library crates with nextest
        run: cargo nextest run -p o-sfu-cluster -p o-sfu-core -p o-sfu-protocol -p o-sfu-rfc -p o-sfu-router

      - name: Run root crate tests
        run: cargo test -p o-sfu

      - name: Run integration and verification crate tests
        run: cargo test -p o-sfu-tests -p o-sfu-proofs

      - name: Run workspace doctests
        run: cargo test --workspace --doc

      - name: Check fuzz targets build
        run: cargo check --manifest-path tests/fuzz/Cargo.toml --locked

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  coverage-report:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-1.95-mainline

      - name: Generate workspace coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Export coverage summary
        run: cargo llvm-cov report --json --summary-only --output-path coverage-summary.json

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-workspace-coverage
          path: |
            lcov.info
            coverage-summary.json
          retention-days: 7

  container-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build server container image
        run: docker build --file Dockerfile --tag o-sfu:test .
