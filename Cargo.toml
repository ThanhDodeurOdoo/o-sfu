[workspace]
exclude = ["tests/fuzz"]
members = [
    "cluster",
    "core",
    "model",
    "protocol",
    "rfc",
    "router",
    "telemetry",
    "telemetry/macros",
    "tests",
    "tests/proofs",
]
resolver = "3"

[workspace.package]
authors = ["ThanhDodeurOdoo"]
edition = "2024"
rust-version = "1.95"
version = "0.3.0" # SFU basic feature is ready and can be used as a substitute for odoo/sfu

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bitflags = "2.6"
futures-util = "0.3"
hmac = "0.13"
o-sfu-protocol = { path = "protocol" }
o-sfu-cluster = { path = "cluster" }
o-sfu-core = { path = "core" }
o-sfu-model = { path = "model" }
o-sfu-rfc = { path = "rfc" }
o-sfu-router = { path = "router" }
o-sfu-telemetry = { path = "telemetry", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
str0m = { version = "0.19", default-features = false, features = ["aws-lc-rs"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.52", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-tungstenite = "0.29"
tokio-util = "0.7"
tracing = "0.1"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4"] }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(kani)",
    "cfg(rust_analyzer)",
] }
unsafe_code = "deny"

[workspace.lints.clippy] # https://rust-lang.github.io/rust-clippy/
correctness = { level = "deny", priority = -1 }
expect_used = { level = "deny", priority = -1 }
indexing_slicing = { level = "deny", priority = -1 }
panic = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
unwrap_used = { level = "deny", priority = -1 }

# groups
complexity = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"

absolute_paths = "warn"
allow_attributes_without_reason = "warn"
as_conversions = "warn"
as_ptr_cast_mut = "warn"
as_underscore = "warn"
assigning_clones = "warn"
clone_on_ref_ptr = "warn"
cognitive_complexity = "warn"
dbg_macro = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
exit = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
non_ascii_literal = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unused_result_ok = "warn"
wildcard_dependencies = "warn"

# nursery as of rust 1.92 https://rust-lang.github.io/rust-clippy/rust-1.92.0/index.html?groups=nursery
needless_pass_by_ref_mut = "warn"
nonstandard_macro_braces = "warn"
option_if_let_else = "warn"
redundant_clone = "warn"
significant_drop_tightening = "warn"
single_option_map = "warn"
trait_duplication_in_bounds = "warn"
type_repetition_in_bounds = "warn"
uninhabited_references = "warn"
unnecessary_struct_initialization = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
while_float = "warn"

[package]
description = "o-sfu"
name = "o-sfu"
autotests = false
default-run = "o-sfu"

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["otel-tracing"]
otel-tracing = ["o-sfu-telemetry/otel-tracing"]
testing-transport = ["o-sfu-core/testing-transport"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bitflags.workspace = true
futures-util.workspace = true
hmac.workspace = true
o-sfu-cluster.workspace = true
o-sfu-protocol.workspace = true
o-sfu-core.workspace = true
o-sfu-rfc.workspace = true
o-sfu-router.workspace = true
o-sfu-telemetry = { workspace = true, features = ["macros"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
str0m.workspace = true
time.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
o-sfu-core = { workspace = true, features = ["testing-transport"] }
o-sfu-telemetry = { workspace = true, features = ["test-support"] }
o-sfu-router = { workspace = true, features = ["test-support"] }
tower = { version = "0.5", features = ["util"] }
