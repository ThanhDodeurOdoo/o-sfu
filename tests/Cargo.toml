[package]
name = "o-sfu-tests"
description = "Integration and verification tests for o-sfu"

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
loom-tests = ["dep:loom"]

[dependencies]
futures-util.workspace = true
loom = { version = "0.7.2", optional = true }
o-sfu = { path = ".." }
o-sfu-protocol = { path = "../protocol" }
o-sfu-router = { path = "../router" }
o-sfu-telemetry = { path = "../telemetry" }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
] }
serde_json.workspace = true
str0m.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
trybuild = "1.0.116"

[lints]
workspace = true

[[test]]
name = "miri_router_protocol"
path = "miri/router_protocol.rs"

[[test]]
name = "loom_source_policy_coordination"
path = "loom/source_policy_coordination.rs"
required-features = ["loom-tests"]

[[test]]
name = "loom_relay_registry_coordination"
path = "loom/relay_registry_coordination.rs"
required-features = ["loom-tests"]

[[test]]
name = "loom_media_tap_coordination"
path = "loom/media_tap_coordination.rs"
required-features = ["loom-tests"]

[[test]]
name = "loom_rtc_worker_startup"
path = "loom/rtc_worker_startup.rs"
required-features = ["loom-tests"]
