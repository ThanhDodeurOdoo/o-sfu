[package]
name = "o-sfu-tests"
description = "Integration and verification tests for o-sfu"

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["otel-tracing"]
otel-tracing = ["o-sfu/otel-tracing"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
futures-util.workspace = true
o-sfu = { path = "..", default-features = false }
o-sfu-protocol = { path = "../crates/protocol" }
o-sfu-rfc = { path = "../crates/rfc" }
o-sfu-router = { path = "../crates/router" }
o-sfu-telemetry = { path = "../crates/telemetry" }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
] }
serde_json.workspace = true
str0m.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
trybuild = "1.0.116"

[dev-dependencies]
o-sfu-core = { path = "../crates/core", features = ["internal-benchmarks"] }

[target.'cfg(any(all(any(target_arch = "x86_64", target_arch = "x86"), any(target_os = "linux", target_os = "freebsd", target_os = "macos", all(target_os = "windows", target_env = "gnu"), target_os = "solaris")), all(target_arch = "aarch64", any(target_os = "freebsd", all(target_os = "linux", target_env = "gnu")))))'.dev-dependencies]
iai-callgrind = { version = "0.16.1", features = ["client_requests"] }

[target.'cfg(not(any(all(any(target_arch = "x86_64", target_arch = "x86"), any(target_os = "linux", target_os = "freebsd", target_os = "macos", all(target_os = "windows", target_env = "gnu"), target_os = "solaris")), all(target_arch = "aarch64", any(target_os = "freebsd", all(target_os = "linux", target_env = "gnu"))))))'.dev-dependencies]
iai-callgrind = "0.16.1"

[lints]
workspace = true

[[bench]]
name = "packet_loop_callgrind"
path = "benchmarks/packet_loop_callgrind.rs"
harness = false

[[test]]
name = "miri_router_protocol"
path = "miri/router_protocol.rs"

[[test]]
name = "miri_auth_codec"
path = "miri/auth_codec.rs"

[[test]]
name = "miri_protocol_core"
path = "miri/protocol_core.rs"

[[test]]
name = "miri_rtp_negotiation"
path = "miri/rtp_negotiation.rs"
