[package]
name = "o-sfu-tests"
description = "Integration and verification tests for o-sfu"

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["otel-tracing"]
otel-tracing = ["o-sfu/otel-tracing"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
futures-util.workspace = true
o-sfu = { path = "..", default-features = false }
o-sfu-protocol = { path = "../protocol" }
o-sfu-rfc = { path = "../rfc" }
o-sfu-router = { path = "../router" }
o-sfu-telemetry = { path = "../telemetry" }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
] }
serde_json.workspace = true
str0m.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
trybuild = "1.0.116"

[lints]
workspace = true

[[test]]
name = "miri_router_protocol"
path = "miri/router_protocol.rs"

[[test]]
name = "miri_auth_codec"
path = "miri/auth_codec.rs"

[[test]]
name = "miri_protocol_core"
path = "miri/protocol_core.rs"

[[test]]
name = "miri_rtp_negotiation"
path = "miri/rtp_negotiation.rs"
